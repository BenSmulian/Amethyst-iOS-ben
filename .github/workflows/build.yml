name: Build Amethyst iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # 1️⃣ Checkout the repo and submodules
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2️⃣ List available schemes for debugging / selection
    - name: List Xcode Schemes (project)
      run: |
        xcodebuild -list -project Amethyst.xcodeproj || echo "Project not found, skipping"
    
    - name: List Xcode Schemes (workspace)
      run: |
        xcodebuild -list -workspace Amethyst.xcworkspace || echo "Workspace not found, skipping"

    # 3️⃣ Install dependencies
    - name: Install Homebrew dependencies
      run: |
        brew install cmake ninja git-lfs
        git lfs pull

    # 4️⃣ Select Xcode version
    - name: Select Xcode
      run: sudo xcode-select --switch /Applications/Xcode.app

    # 5️⃣ Build the app
    - name: Build Amethyst
      run: |
        # ← REPLACE THIS SCHEME with the one from the log above
        SCHEME="AmethystIOS"
        # Use workspace if available, else fallback to project
        if [ -f "Amethyst.xcworkspace" ]; then
          xcodebuild -workspace Amethyst.xcworkspace \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO
        else
          xcodebuild -project Amethyst.xcodeproj \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO
        fi

    # 6️⃣ Package into .ipa
    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -R build/Release-iphoneos/*.app Payload/
        zip -r Amethyst.ipa Payload

    # 7️⃣ Upload IPA artifact
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Amethyst-IPA
        path: Amethyst.ipa
