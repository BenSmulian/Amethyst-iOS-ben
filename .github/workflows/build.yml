name: Build Amethyst iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2️⃣ List workspace schemes
    - name: List Xcode Workspace Schemes
      run: |
        xcodebuild -list -workspace Amethyst.xcworkspace

    # 3️⃣ Install Homebrew dependencies
    - name: Install Homebrew dependencies
      run: |
        brew install cmake ninja git-lfs
        git lfs pull

    # 4️⃣ Select Xcode
    - name: Select Xcode
      run: sudo xcode-select --switch /Applications/Xcode.app

    # 5️⃣ Build the app using workspace
    - name: Build Amethyst
      run: |
        # Replace this with the scheme listed from previous step
        SCHEME="AmethystIOS"  # <-- Update with actual scheme name from workspace
        xcodebuild -workspace Amethyst.xcworkspace \
                   -scheme "$SCHEME" \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO

    # 6️⃣ Package IPA
    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -R build/Release-iphoneos/*.app Payload/
        zip -r Amethyst.ipa Payload

    # 7️⃣ Upload IPA
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Amethyst-IPA
        path: Amethyst.ipa
